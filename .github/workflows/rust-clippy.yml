# Clippy SARIF upload for GitHub code scanning (Linux only).

name: rust-clippy analyze

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]
  schedule:
    - cron: '32 13 * * 2'

defaults:
  run:
    working-directory: vips-rs

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout vips-rs
        uses: actions/checkout@v7
        with:
          path: vips-rs

      - name: Checkout vips-sys (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: houseme/vips-sys
          path: vips-sys

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvips-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run rust-clippy
        run:
          cargo clippy
          --all-targets
          --all-features
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: vips-rs/rust-clippy-results.sarif
          wait-for-processing: true
