# Publish `vips` to crates.io and create a GitHub Release when a version tag is pushed.
#
# Required repository secret:
#   CRATES_IO_TOKEN — crates.io API token with publish rights for crate `vips`
#
# Tag format: vX.Y.Z or vX.Y.Z-pre (must match Cargo.toml version without the leading `v`)
# Release order: publish vips-sys first, then tag this repo.
#
# Verify runs on Linux / macOS / Windows. Publish uses the crates.io-resolved
# vips-sys (path dep is stripped by cargo package).

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: vips-rs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate: tag/version consistency + multi-OS quality checks ─────────────────
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            link_tests: true
            gates: true
          - os: macos-latest
            link_tests: true
            gates: false
          - os: windows-latest
            link_tests: false
            gates: false
    steps:
      - name: Checkout vips-rs
        uses: actions/checkout@v7
        with:
          path: vips-rs

      - name: Checkout vips-sys (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: houseme/vips-sys
          path: vips-sys

      - name: Check tag matches Cargo.toml version
        if: matrix.gates
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=${tag} crate=${crate}"
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::Git tag v${tag} does not match Cargo.toml version ${crate}"
            exit 1
          fi

      - name: Check CHANGELOG has a section for this version
        if: matrix.gates
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${ver}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section. Move Unreleased notes before tagging."
            exit 1
          fi
          if grep -qE '^## \[Unreleased\]' CHANGELOG.md; then
            body="$(awk '
              $0 ~ /^## \[Unreleased\]/ {grab=1; next}
              grab && /^## \[/ {exit}
              grab {print}
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' | sed '/^### /d')"
            if [ -n "${body}" ]; then
              echo "::error::CHANGELOG.md [Unreleased] still has notes. Fold them into [${ver}] before tagging."
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install libvips (Linux)
        if: runner.os == 'Linux' && matrix.link_tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libvips libvips-dev libvips-tools

      - name: Install libvips (macOS)
        if: runner.os == 'macOS' && matrix.link_tests
        run: |
          brew install vips pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix vips)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vips-rs/target
            vips-sys/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('vips-rs/Cargo.lock') }}

      - name: cargo fmt
        if: matrix.gates
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: matrix.link_tests
        run: cargo test --all-features

      - name: Package dry-run
        if: matrix.gates
        # Proves the crate is publishable (path deps stripped to version-only).
        run: |
          cargo package --list
          cargo publish --dry-run --locked

  # ── Publish crates.io + GitHub Release (after all platforms pass) ───────────
  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: vips-rs

      - name: Checkout vips-sys (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: houseme/vips-sys
          path: vips-sys

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "v${ver}" > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: vips-rs/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
