[package]
name = "vips"
version = "0.3.0"
authors = ["elbaro <elbaro@github>", "houseme <housemecn@gmail.com>"]
edition = "2024"
resolver = "3"
description = "Rust bindings for libvips: fast, low-memory image processing with a safe, ergonomic API."
keywords = ["vips", "image", "libvips"]
documentation = "https://docs.rs/vips"
repository = "https://github.com/houseme/vips-rs"
categories = ["multimedia::images"]
license = "MIT"

# Pin the coordinated sys update until its crates.io release is available.
[dependencies]
vips-sys = { version = "0.4.0", git = "https://github.com/houseme/vips-sys", rev = "366afa4d6d7c48d84edbbb86733428ff20b5c6a7", features = ["helpers"] }

[features]
default = []
v8_18 = ["vips-sys/v8_18"]
v8_19 = ["v8_18", "vips-sys/v8_19"]

[dev-dependencies]
trybuild = "1.0"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
